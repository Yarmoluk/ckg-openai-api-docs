<rect x="670" y="596" width="410" height="88" rx="12" fill="white" stroke="#cddfd9"/><text x="690" y="630" font-size="21" font-weight="650" fill="#163a3a">Prompt caching guide</text><text x="690" y="657" font-family="monospace" font-size="12" fill="#57716d">OAI-c86beef864f4</text>
<path d="M450 641 H654" fill="none" stroke="#7a8e9b" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#soft)"/><rect x="482" y="611" width="140" height="22" rx="5" fill="#f4f8f7"/><text x="552" y="626" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#7a8e9b">RELATES_TO</text>
<text x="40" y="752" font-size="14" fill="#49645f">Solid = documented requirement. Dashed = contextual link to a guide, not a prerequisite.</text></g></svg>
