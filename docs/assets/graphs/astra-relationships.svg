<rect x="40" y="477" width="410" height="88" rx="12" fill="white" stroke="#cddfd9"/><text x="60" y="511" font-size="21" font-weight="650" fill="#163a3a">Change reasoning effort</text><text x="60" y="538" font-family="monospace" font-size="12" fill="#57716d">REASON-UPDATE</text>
