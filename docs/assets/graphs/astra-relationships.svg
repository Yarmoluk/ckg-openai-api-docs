<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc">
<title id="title">Five declared relationships in the Astra reference</title>
<desc id="desc">Two requirement edges connect Astra function calling to Responses and mid-turn steering to WebSocket. Three context edges connect async result correlation, reasoning updates and compaction cache reuse to their source guides.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147766"/></marker><marker id="soft" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7a8e9b"/></marker></defs>
<rect width="1120" height="790" rx="22" fill="#f4f8f7"/>
<g font-family="system-ui,Segoe UI,sans-serif"><text x="40" y="48" font-size="14" font-weight="700" letter-spacing="2" fill="#216c60">ASTRA / DECLARED RELATIONSHIPS</text><text x="40" y="82" font-size="25" font-weight="700" fill="#163a3a">Start with the behavior. Follow the relationship.</text>
<rect x="40" y="120" width="410" height="88" rx="12" fill="white" stroke="#cddfd9"/><text x="60" y="154" font-size="21" font-weight="650" fill="#163a3a">Astra function calling</text><text x="60" y="181" font-family="monospace" font-size="12" fill="#57716d">ASTRA-TOOLS</text>
<rect x="670" y="120" width="410" height="88" rx="12" fill="white" stroke="#cddfd9"/><text x="690" y="154" font-size="21" font-weight="650" fill="#163a3a">Responses API</text><text x="690" y="181" font-family="monospace" font-size="12" fill="#57716d">RESPONSES-API</text>
<path d="M450 165 H654" fill="none" stroke="#147766" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="482" y="135" width="140" height="22" rx="5" fill="#f4f8f7"/><text x="552" y="150" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#147766">REQUIRES</text>
<rect x="40" y="239" width="410" height="88" rx="12" fill="white" stroke="#cddfd9"/><text x="60" y="273" font-size="21" font-weight="650" fill="#163a3a">Mid-turn steering</text><text x="60" y="300" font-family="monospace" font-size="12" fill="#57716d">STEER-WS</text>
<rect x="670" y="239" width="410" height="88" rx="12" fill="white" stroke="#cddfd9"/><text x="690" y="273" font-size="21" font-weight="650" fill="#163a3a">Responses WebSocket</text><text x="690" y="300" font-family="monospace" font-size="12" fill="#57716d">RESPONSES-WS</text>
<path d="M450 284 H654" fill="none" stroke="#147766" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="482" y="254" width="140" height="22" rx="5" fill="#f4f8f7"/><text x="552" y="269" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#147766">REQUIRES</text>
<rect x="40" y="358" width="410" height="88" rx="12" fill="white" stroke="#cddfd9"/><text x="60" y="392" font-size="21" font-weight="650" fill="#163a3a">Async result correlation</text><text x="60" y="419" font-family="monospace" font-size="12" fill="#57716d">ASYNC-ID</text>
<rect x="670" y="358" width="410" height="88" rx="12" fill="white" stroke="#cddfd9"/><text x="690" y="392" font-size="21" font-weight="650" fill="#163a3a">Async tool calling guide</text><text x="690" y="419" font-family="monospace" font-size="12" fill="#57716d">OAI-065081c54a27</text>
