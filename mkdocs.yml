site_name: Astra Developer Reference CKG
site_description: "Astra Developer Reference CKG: source-linked context for building with Astra and OpenAI APIs."
site_url: https://yarmoluk.github.io/astra-developer-reference-ckg/
repo_url: https://github.com/Yarmoluk/astra-developer-reference-ckg
repo_name: Yarmoluk/astra-developer-reference-ckg
use_directory_urls: false
theme:
  name: material
  palette:
    scheme: default
    primary: teal
    accent: teal
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - content.code.copy
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Overview: index.md
  - Astra reference: astra.md
  - Architecture: architecture.md
  - Run it: quickstart.md
  - Evaluation: evaluation.md
  - Provenance & maintenance: provenance.md
